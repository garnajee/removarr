[package]
name = "removarr"
description = "Composition root and CLI entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
removarr-domain = { workspace = true }
removarr-config = { workspace = true }
removarr-storage = { workspace = true }
removarr-fs = { workspace = true }
removarr-qbit = { workspace = true }
removarr-arr = { workspace = true }
removarr-jellyfin = { workspace = true }
removarr-matching = { workspace = true }
removarr-workflows = { workspace = true }
removarr-jobs = { workspace = true }
removarr-reporting = { workspace = true }
removarr-web = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
axum = { workspace = true }
async-trait = { workspace = true }
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }

[[bin]]
name = "removarr"
path = "src/main.rs"
