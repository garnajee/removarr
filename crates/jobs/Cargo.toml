[package]
name = "removarr-jobs"
description = "Persistent job runtime, lanes, scheduler and locks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
removarr-domain = { workspace = true }
removarr-workflows = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
removarr-testkit = { workspace = true }
# Test-only: real SQLite repositories for the persistent queue and restart tests (normal
# dependencies stay domain + workflows, architecture 2.2).
removarr-storage = { workspace = true }
tempfile = { workspace = true }
# Test-only: the action runner's lab (`real_runner.rs`) drives the real runner through the
# `tier5-test-gate` feature while `IMPLEMENTED_TIER` stays T4. No production build enables it.
removarr-workflows = { workspace = true, features = ["tier5-test-gate"] }
removarr-fs = { workspace = true }
removarr-config = { workspace = true, features = ["test-support"] }
removarr-matching = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
