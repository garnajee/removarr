<!doctype html>
<html lang="{{ ctx.chrome.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{ ctx.tr.t("login.title") }} - {{ ctx.tr.t("app.name") }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main id="main" class="wrap">
<h1>{{ ctx.tr.t("login.title") }}</h1>
{% if let Some(k) = v.error_key %}<p class="state error" id="login-error" role="alert">{{ ctx.tr.t(k) }}</p>{% endif %}
{% if let Some(s) = v.retry_after %}<p class="state incomplete" role="status">{{ ctx.tn("login.retry_after", s) }}</p>{% endif %}
{% if !ctx.chrome.csrf.is_empty() %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ ctx.chrome.csrf }}">
<div class="field"><label for="u">{{ ctx.tr.t("login.username") }}</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required></div>
<div class="field"><label for="p">{{ ctx.tr.t("login.password") }}</label><input id="p" type="password" name="password" autocomplete="current-password" maxlength="1024" required></div>
<button type="submit" class="primary">{{ ctx.tr.t("login.submit") }}</button>
</form>
{% endif %}
</main>
</body>
</html>
