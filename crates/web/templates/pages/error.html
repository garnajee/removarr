<!doctype html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ code }}</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
<nav class="tabbar" aria-label="{{ nav_label }}"><ul>{% for n in nav %}<li><a href="{{ n.0 }}">{{ n.1 }}</a></li>{% endfor %}</ul></nav>
<main class="wrap">
<h1>{{ code }}</h1>
<p class="state error" role="alert">{{ message }}</p>
{% if !details.is_empty() %}<ul>{% for d in details %}<li>{{ d }}</li>{% endfor %}</ul>{% endif %}
<p class="tag">{{ reference }}: <code>{{ correlation }}</code></p>
<p><a class="btn" href="/">{{ app }}</a></p>
</main>
</body>
</html>
