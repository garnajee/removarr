<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Removarr</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- DataTables & Responsive CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        .file-checkbox {
            transform: scale(1.3);
            cursor: pointer;
        }
        .stats-box {
            background-color: #f8f9fa;
            border-left: 5px solid #0d6efd;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
        }
        td { vertical-align: middle; }
        
        @media (max-width: 768px) {
            .toolbar-actions { flex-direction: column; width: 100%; gap: 10px; }
            .toolbar-actions > div { width: 100%; justify-content: space-between; }
            .stats-box { text-align: left !important; margin-top: 10px; }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4 py-md-5">
        
        <div class="row mb-4 align-items-center">
            <div class="col-12 col-md-6">
                <h1 class="display-6 fw-bold text-primary mb-0"><i class="bi bi-hdd-network"></i> Removarr</h1>
                <p class="text-muted">Unlinked Torrents Manager</p>
            </div>
            <div class="col-12 col-md-6 text-md-end">
                <div class="stats-box d-inline-block text-start shadow-sm">
                    <h6 class="mb-0 text-muted">Potential Freed Space:</h6>
                    <h3 class="text-success fw-bold mb-0" id="total-size">0 B</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 toolbar-actions">
                    
                    <!-- Refresh & Select All -->
                    <div class="d-flex gap-2 w-sm-100">
                        <button type="button" class="btn btn-outline-primary flex-fill" onclick="refreshFileList()">
                            <i class="bi bi-arrow-clockwise"></i> <span class="d-none d-md-inline">Refresh</span>
                        </button>
                        <button type="button" class="btn btn-outline-secondary flex-fill" onclick="toggleSelectAll()">
                            <i class="bi bi-check-all"></i> <span class="d-none d-md-inline">Select All</span>
                        </button>
                    </div>
                    
                    <!-- days filter -->
                    <div class="d-flex align-items-center bg-light p-2 rounded border flex-fill justify-content-center">
                        <div class="form-check form-switch fs-6 mb-0 me-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="filterAgeSwitch" checked onchange="renderTables()">
                            <label class="form-check-label text-muted" for="filterAgeSwitch">Hide <</label>
                        </div>
                        <input type="number" id="filterAgeDays" class="form-control form-control-sm text-center mx-1" value="3" min="0" step="1" style="width: 60px;" oninput="renderTables()">
                        <span class="text-muted">days</span>
                    </div>

                    <!-- actions buttons -->
                    <div class="d-flex gap-2 w-sm-100" id="main-actions">
                        <button type="button" class="btn btn-warning flex-fill text-dark fw-medium" onclick="ignoreSelectedFiles()">
                            <i class="bi bi-eye-slash"></i> <span class="d-none d-md-inline">Ignore</span>
                        </button>
                        <button type="button" class="btn btn-danger flex-fill fw-medium" onclick="deleteSelectedFiles()">
                            <i class="bi bi-trash3"></i> <span class="d-none d-md-inline">Delete</span>
                        </button>
                    </div>

                    <div class="d-flex gap-2 w-sm-100 d-none" id="ignored-actions">
                        <button type="button" class="btn btn-success flex-fill fw-medium" onclick="restoreSelectedFiles()">
                            <i class="bi bi-eye"></i> <span class="d-none d-md-inline">Restore Selected</span>
                        </button>
                    </div>

                </div>

                <!-- tabs system -->
                <ul class="nav nav-tabs mb-3" id="torrentsTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active text-primary fw-bold" id="main-tab" data-bs-toggle="tab" data-bs-target="#main-pane" type="button" role="tab">
                            <i class="bi bi-list-task"></i> To Delete (<span id="count-main">0</span>)
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link text-secondary" id="ignored-tab" data-bs-toggle="tab" data-bs-target="#ignored-pane" type="button" role="tab">
                            <i class="bi bi-eye-slash"></i> Ignored (<span id="count-ignored">0</span>)
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="torrentsTabsContent">
                    
                    <!-- main tab -->
                    <div class="tab-pane fade show active" id="main-pane" role="tabpanel" tabindex="0">
                        <div class="table-responsive-custom">
                            <table id="mainTable" class="table table-hover table-bordered w-100 align-middle dt-responsive">
                                <thead class="table-light">
                                    <tr>
                                        <th class="all text-center" style="width: 40px;">Sel.</th>
                                        <th class="all">File Name</th>
                                        <th data-priority="3">Age</th>
                                        <th data-priority="2">Size</th>
                                        <th class="all text-center" style="width: 120px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="main-file-list"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- ignored tabs -->
                    <div class="tab-pane fade" id="ignored-pane" role="tabpanel" tabindex="0">
                        <div class="alert alert-secondary py-2 mb-3">
                            <i class="bi bi-info-circle"></i> These torrents are hidden from the main list and protected from bulk deletion.
                        </div>
                        <div class="table-responsive-custom">
                            <table id="ignoredTable" class="table table-hover table-bordered w-100 align-middle dt-responsive">
                                <thead class="table-light">
                                    <tr>
                                        <th class="all text-center" style="width: 40px;">Sel.</th>
                                        <th class="all">File Name</th>
                                        <th data-priority="3">Age</th>
                                        <th data-priority="2">Size</th>
                                        <th class="all text-center" style="width: 120px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="ignored-file-list"></tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        let allTorrentsData = [];
        let mainDataTable = null;
        let ignoredDataTable = null;
        
        let ignoredNames = JSON.parse(localStorage.getItem('removarr_ignored_list') || '[]');

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function refreshFileList() {
            if (mainDataTable) { mainDataTable.destroy(); mainDataTable = null; }
            if (ignoredDataTable) { ignoredDataTable.destroy(); ignoredDataTable = null; }
            
            $('#main-file-list').html('<tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary"></div><br>Loading...</td></tr>');
            $('#ignored-file-list').empty();
            
            $.getJSON('/files', function(data) {
                allTorrentsData = data;
                renderTables();
            }).fail(function() {
                alert("Error fetching files list.");
                $('#main-file-list').empty();
            });
        }

        function toggleIgnore(name) {
            if (ignoredNames.includes(name)) {
                ignoredNames = ignoredNames.filter(n => n !== name);
            } else {
                ignoredNames.push(name);
            }
            localStorage.setItem('removarr_ignored_list', JSON.stringify(ignoredNames));
            renderTables();
        }

        function renderTables() {
            const hideRecent = $('#filterAgeSwitch').is(':checked');
            const minDays = parseFloat($('#filterAgeDays').val()) || 0;
            
            if (mainDataTable) mainDataTable.destroy();
            if (ignoredDataTable) ignoredDataTable.destroy();

            $('#main-file-list').empty();
            $('#ignored-file-list').empty();
            
            let totalBytes = 0;
            let countMain = 0;
            let countIgnored = 0;

            allTorrentsData.forEach((file) => {
                let isIgnored = ignoredNames.includes(file.name);
                
                if (!isIgnored && hideRecent && file.age_days < minDays) return;

                let crossSeedBadge = file.cross_seeds_count > 1 ? `<span class="badge bg-warning text-dark ms-2" title="Cross-seeded">x${file.cross_seeds_count}</span>` : '';
                let idsJson = JSON.stringify(file.ids).replace(/"/g, '&quot;');
                let safeName = file.name.replace(/"/g, '&quot;');

                if (isIgnored) {
                    countIgnored++;
                    $('#ignored-file-list').append(`
                        <tr>
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input ignored-checkbox" data-name="${safeName}">
                            </td>
                            <td class="fw-medium text-break">${file.name} ${crossSeedBadge}</td>
                            <td data-order="${file.age_days}">${file.age_days.toFixed(1)} d</td>
                            <td data-order="${file.size}">${formatBytes(file.size)}</td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <button type="button" class="btn btn-sm btn-outline-success" title="Restore to Main List" data-name="${safeName}" onclick="toggleIgnore(this.getAttribute('data-name'))">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `);
                } else {
                    totalBytes += file.size;
                    countMain++;
                    $('#main-file-list').append(`
                        <tr>
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input file-checkbox" data-ids="${idsJson}" data-name="${safeName}">
                            </td>
                            <td class="fw-medium text-break">${file.name} ${crossSeedBadge}</td>
                            <td data-order="${file.age_days}">${file.age_days.toFixed(1)} d</td>
                            <td data-order="${file.size}">${formatBytes(file.size)}</td>
                            <td class="text-center">
                                <div class="d-flex gap-1 justify-content-center">
                                    <button type="button" class="btn btn-sm btn-outline-secondary" title="Ignore/Hide" data-name="${safeName}" onclick="toggleIgnore(this.getAttribute('data-name'))">
                                        <i class="bi bi-eye-slash"></i>
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" title="Delete" onclick="deleteFile('${idsJson}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `);
                }
            });

            $('#total-size').text(formatBytes(totalBytes));
            $('#count-main').text(countMain);
            $('#count-ignored').text(countIgnored);

            let dtConfig = {
                "order": [[1, "asc"]],
                "pageLength": 25,
                "lengthMenu": [10, 25, 50, 100],
                "responsive": true,
                "columnDefs": [{ "orderable": false, "targets": [0, 4] }]
            };

            mainDataTable = $('#mainTable').DataTable(dtConfig);
            ignoredDataTable = $('#ignoredTable').DataTable(dtConfig);
        }

        function deleteSelectedFiles() {
            var selectedIdsGroups = [];
            if (mainDataTable) {
                mainDataTable.$('.file-checkbox:checked').each(function() {
                    selectedIdsGroups.push(JSON.parse($(this).attr('data-ids')));
                });
            }

            if (selectedIdsGroups.length === 0) {
                alert('Select at least one file to delete in the Main List.');
                return;
            }

            if (confirm(`Are you sure you want to delete the ${selectedIdsGroups.length} selected items?`)) {
                $.ajax({
                    url: '/files', type: 'DELETE', data: JSON.stringify({ ids: selectedIdsGroups }),
                    contentType: 'application/json',
                    success: function(result) { refreshFileList(); },
                    error: function(result) { alert(result.responseJSON?.error || "An error occurred."); }
                });
            }
        }

        function ignoreSelectedFiles() {
            var selectedCount = 0;
            if (mainDataTable) {
                mainDataTable.$('.file-checkbox:checked').each(function() {
                    var name = $(this).attr('data-name');
                    if (!ignoredNames.includes(name)) ignoredNames.push(name);
                    selectedCount++;
                });
            }

            if (selectedCount === 0) {
                alert('Select at least one file to ignore.');
                return;
            }

            localStorage.setItem('removarr_ignored_list', JSON.stringify(ignoredNames));
            selectAllToggle = false;
            renderTables();
        }

        function restoreSelectedFiles() {
            var selectedCount = 0;
            if (ignoredDataTable) {
                ignoredDataTable.$('.ignored-checkbox:checked').each(function() {
                    var name = $(this).attr('data-name');
                    ignoredNames = ignoredNames.filter(n => n !== name);
                    selectedCount++;
                });
            }

            if (selectedCount === 0) {
                alert('Select at least one file to restore.');
                return;
            }

            localStorage.setItem('removarr_ignored_list', JSON.stringify(ignoredNames));
            selectAllToggle = false;
            renderTables();
        }

        function deleteFile(idsJsonStr) {
            const idsArray = JSON.parse(idsJsonStr.replace(/&quot;/g, '"'));
            if (confirm('Delete this file ' + (idsArray.length > 1 ? '(and all cross-seeds)' : '') + '?')) {
                $.ajax({
                    url: '/files', type: 'DELETE', data: JSON.stringify({ ids: [idsArray] }),
                    contentType: 'application/json',
                    success: function() { refreshFileList(); }
                });
            }
        }

        var selectAllToggle = false;
        function toggleSelectAll() {
            selectAllToggle = !selectAllToggle;
            
            let activeTab = $('.nav-tabs .active').attr('id');
            if (activeTab === 'main-tab' && mainDataTable) {
                let filteredNodes = mainDataTable.rows({ search: 'applied' }).nodes();
                $(filteredNodes).find('.file-checkbox').prop('checked', selectAllToggle);
            } else if (activeTab === 'ignored-tab' && ignoredDataTable) {
                let filteredNodes = ignoredDataTable.rows({ search: 'applied' }).nodes();
                $(filteredNodes).find('.ignored-checkbox').prop('checked', selectAllToggle);
            }
        }

        $(document).ready(function() {
            refreshFileList();
            
            $('button[data-bs-toggle="tab"]').on('shown.bs.tab', function (e) {
                selectAllToggle = false;
                
                if (mainDataTable) mainDataTable.responsive.recalc();
                if (ignoredDataTable) ignoredDataTable.responsive.recalc();
                
                if (e.target.id === 'main-tab') {
                    $('#main-actions').removeClass('d-none');
                    $('#ignored-actions').addClass('d-none');
                } else {
                    $('#main-actions').addClass('d-none');
                    $('#ignored-actions').removeClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
