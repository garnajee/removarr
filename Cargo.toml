[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Internal crates (dependency direction: docs/architecture.md section 2.2)
removarr-domain = { path = "crates/domain" }
removarr-config = { path = "crates/config" }
removarr-storage = { path = "crates/storage" }
removarr-fs = { path = "crates/fs" }
removarr-qbit = { path = "crates/qbit" }
removarr-arr = { path = "crates/arr" }
removarr-jellyfin = { path = "crates/jellyfin" }
removarr-matching = { path = "crates/matching" }
removarr-workflows = { path = "crates/workflows" }
removarr-jobs = { path = "crates/jobs" }
removarr-reporting = { path = "crates/reporting" }
removarr-web = { path = "crates/web" }
removarr-testkit = { path = "crates/testkit" }

# Third-party (docs/architecture.md section 3)
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "net"] }
tokio-util = "0.7.15"
axum = "0.8.4"
axum-extra = { version = "0.10", features = ["cookie-private", "form"] }
tower = { version = "0.5.2", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6.2", features = ["trace", "timeout", "limit", "set-header", "catch-panic"] }
askama = "0.14"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
url = "2.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "registry"] }
async-trait = "0.1.88"
uuid = { version = "1.16", features = ["serde"] }
sha2 = "0.10.8"
rustix = { version = "1.0", features = ["fs", "process"] }
argon2 = "0.5.3"
getrandom = "0.3"
ipnet = { version = "2.11", features = ["serde"] }
regex = "1.11"
unicode-normalization = "0.1.24"
time = { version = "0.3.37", features = ["formatting", "macros"] }
http-body-util = "0.1.3"
tempfile = "3.15"
proptest = "1.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
